<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>TikTok Callback</title></head>
<body>
  <p id="status">Redirection en cours...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    fetch("http://127.0.0.1:8080/callback?" + params.toString())
      .then(() => {
        document.getElementById("status").textContent =
          error ? "Erreur d'autorisation." : "Autorisation reçue, tu peux fermer cet onglet.";
      })
      .catch(() => {
        document.getElementById("status").textContent =
          "Impossible de contacter le script local. Copie ce code manuellement : " + code;
      });
  </script>
</body>
</html>
