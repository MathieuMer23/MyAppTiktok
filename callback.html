<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorisation TikTok — Callback</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 600px;
    margin: 80px auto;
    padding: 0 24px;
    color: #1a1a1a;
    text-align: center;
  }
  h1 { font-size: 1.4em; margin-bottom: 24px; }
  .code-box {
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 20px;
    font-family: monospace;
    font-size: 0.95em;
    word-break: break-all;
    margin: 20px 0;
    text-align: left;
  }
  .label { color: #6b7280; font-size: 0.85em; margin-bottom: 6px; }
  button {
    background: #111827;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9em;
  }
  .error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Autorisation TikTok</h1>
  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const resultDiv = document.getElementById('result');

    if (error) {
      resultDiv.innerHTML = `<p class="error">Erreur d'autorisation : ${error}</p>`;
    } else if (code) {
      resultDiv.innerHTML = `
        <p class="label">Code d'autorisation reçu :</p>
        <div class="code-box" id="codeBox">${code}</div>
        <p class="label">State : ${state || '(aucun)'}</p>
        <button onclick="navigator.clipboard.writeText('${code}'); this.textContent='Copié !'">Copier le code</button>
      `;
    } else {
      resultDiv.innerHTML = `<p class="error">Aucun code trouvé dans l'URL.</p>`;
    }
  </script>
</body>
</html>
